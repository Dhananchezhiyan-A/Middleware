        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /analytics/sources:
    get:
      tags: [analytics]
      operationId: analyticsSources
      summary: Per-source lead counts grouped by status (groupBy)
      x-audit-status: implemented
      x-permission: analytics:read
      responses:
        "200":
          description: Source performance
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/SourcePerformanceRow" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /analytics/destinations:
    get:
      tags: [analytics]
      operationId: analyticsDestinations
      summary: Per-destination outcomes + latency
      description: Implementation loads all tenant delivery rows into JS — hot spot (finding H-8).
      x-audit-status: implemented
      x-permission: analytics:read
      responses:
        "200":
          description: Destination performance
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/DestinationPerformanceRow" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /analytics/pipeline:
    get:
      tags: [analytics]
      operationId: analyticsPipeline
      summary: Stage funnel (leads grouped by current stage)
      x-audit-status: implemented
      x-permission: analytics:read
      responses:
        "200":
          description: Funnel
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PipelineFunnel" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /health:
    get:
      tags: [health]
      operationId: healthGet
      summary: Liveness probe with real PostgreSQL + Redis checks
      description: |
        PARTIAL (finding H-10): always returns **200** even when `status: degraded`,
        error strings are exposed verbatim, and the worker/BullMQ consumer is not
        checked. No unprefixed `/health` exists (no deployment target yet).
      x-audit-status: partial
      x-permission: public
      security: []
      responses:
        "200":
          description: Health report (ok or degraded — code stays 200, see description)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/HealthReport" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived access token (default TTL 900 s). Verified by signature, then
        the user/role/tenant are re-loaded from the database on **every** request
        (status checks always fresh). Finding H-3: revoking sessions does not
        invalidate already-issued access tokens until expiry.
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        Long-lived API key (raw value shown once at creation, SHA-256 hash stored).
        Takes precedence over the bearer header. Status/revoked/expiry/tenant are
        checked; the owning user's status is **not** (finding H-4), and empty
        scopes map to the wildcard permission `*` (finding H-2).
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Tenant-scoped resource id (cross-tenant → 404)
      schema: { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9_-]+$" }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `nextCursor`
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      description: Page size
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  responses:
    BadRequest:
      description: Request validation failed (zod DTO pipe) — `BAD_REQUEST` with `details[]`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: Missing/invalid/expired credentials — `UNAUTHENTICATED` or `TOKEN_EXPIRED`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not permitted (or self-disable / suspended tenant) — `FORBIDDEN`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found **or** exists in another tenant (anti-enumeration) — `NOT_FOUND`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: State conflict — `CONFLICT` / `LEAD_DUPLICATE` / `LEAD_NOT_PROCESSABLE`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: Service-level ZodError — `VALIDATION_FAILED` (422)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: Body/upload over limit — `PAYLOAD_TOO_LARGE` / `IMPORT_TOO_LARGE` (413)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests — `RATE_LIMITED` (429)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: Redis/BullMQ unavailable for the required operation — `QUEUE_UNAVAILABLE` (503)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Unexpected error — `INTERNAL_ERROR` (500); stack traces are never returned
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    # ------------------------------ envelope ------------------------------
    Success:
      type: object
      required: [success, data]
      description: Success envelope. `data` is endpoint-specific and `null` when the handler returns nothing.
      properties:
        success: { type: boolean, enum: [true] }
        data:
          description: Endpoint-specific payload (see each operation's allOf wrapper).
    Error:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error: { $ref: "#/components/schemas/ErrorBody" }
    ErrorBody:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          description: |
            Stable machine code, e.g. BAD_REQUEST, VALIDATION_FAILED, UNAUTHENTICATED,
            TOKEN_EXPIRED, FORBIDDEN, NOT_FOUND, CONFLICT, IDEMPOTENCY_CONFLICT,
            RATE_LIMITED, PAYLOAD_TOO_LARGE, INTERNAL_ERROR, SERVICE_UNAVAILABLE,
            WEBHOOK_SIGNATURE_INVALID, WEBHOOK_UNKNOWN_SOURCE, WEBHOOK_PAYLOAD_INVALID,
            LEAD_DUPLICATE, LEAD_NOT_PROCESSABLE, DESTINATION_*, DELIVERY_DEAD,
            IMPORT_FILE_INVALID, IMPORT_TOO_LARGE, QUEUE_UNAVAILABLE, DATABASE_ERROR.
        message: { type: string }
        requestId: { type: string, description: 'Correlation id, also echoed in the x-correlation-id header' }
        details:
          description: Optional field-level issues (path/message rows)
    # ------------------------------ auth ---------------------------------
    SessionUser:
      type: object
      required: [id, email, name, role, permissions, tenantId, tenantName, tenantSlug]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, description: Role name }
        permissions:
          type: array
          items: { type: string }
        tenantId: { type: string }
        tenantName: { type: string }
        tenantSlug: { type: string }
    AuthSession:
      type: object
      required: [accessToken, refreshToken, refreshExpiresAt, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string, description: Also set as httpOnly cookie (path /api/v1/auth) — finding H-9 notes the body copy }
        refreshExpiresAt: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/SessionUser" }
    MeResult:
      type: object
      required: [user, tenant]
      properties:
        user:
          type: object
          required: [id, email, role, permissions, actorType]
          properties:
            id: { type: string }
            email: { type: string, format: email }
            role: { type: string }
            permissions: { type: array, items: { type: string } }
            actorType: { type: string, enum: [USER, API_KEY, SYSTEM, WORKER] }
            name: { type: string }
        tenant:
          type: object
          required: [id, name, slug]
          properties:
            id: { type: string }
            name: { type: string }
            slug: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
        slug:
          type: string
          description: Workspace slug — required when the email exists in 2+ tenants
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          minLength: 2
          maxLength: 48
    RegisterRequest:
      type: object
      required: [tenantName, slug, name, email, password]
      properties:
        tenantName: { type: string, minLength: 2, maxLength: 120 }
        slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", minLength: 2, maxLength: 48 }
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: ≥12 chars with lowercase, uppercase and a digit (mirrors passwordSchema)
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 32
          maxLength: 512
          description: Optional when the httpOnly refresh cookie is present
    # ------------------------------ tenants ------------------------------
    TenantSummary:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        status: { type: string, description: TenantStatus (ACTIVE/SUSPENDED…) }
        createdAt: { type: string, format: date-time }
    TenantUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        settings:
          type: object
          additionalProperties: true
          description: Accepted by the schema but currently not applied by the service (uses `name` only)
    # ------------------------------ users --------------------------------
    UserListItem:
      type: object
      required: [id, email, status, createdAt, role]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, INVITED, DISABLED] }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        role:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
    UserListData:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/UserListItem" } }
        nextCursor: { type: string, nullable: true }
    UserCreateRequest:
      type: object
      required: [email, name, password, roleId]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        name: { type: string, minLength: 1, maxLength: 120 }
        password: { type: string, minLength: 12, maxLength: 128 }
        roleId: { type: string, maxLength: 64 }
    UserUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        roleId: { type: string, maxLength: 64 }
        status: { type: string, enum: [ACTIVE, INVITED, DISABLED] }
    # ------------------------------ roles --------------------------------
    RoleListItem:
      type: object
      required: [id, name, permissions, isSystem, createdAt, userCount]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        permissions: { type: array, items: { type: string } }
        isSystem: { type: boolean }
        createdAt: { type: string, format: date-time }
        userCount: { type: integer }
    RoleUpsertRequest:
      type: object
      required: [name, permissions]
      properties:
        name: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", minLength: 2, maxLength: 48 }
        description: { type: string, maxLength: 500 }
        permissions:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, minLength: 1, maxLength: 64 }
          description: Catalog codes only (no wildcard)
    PermissionCatalog:
      type: object
      required: [items, templates]
      properties:
        items: { type: array, items: { type: string }, description: All 34 permission codes }
        templates:
          type: object
          description: System role templates (admin/manager/developer/viewer)
          additionalProperties:
            type: object
            properties:
              description: { type: string }
              permissions: { type: array, items: { type: string } }
    DeletedAck:
      type: object
      required: [deleted]
      properties:
        deleted: { type: boolean, enum: [true] }
    RevokedAck:
      type: object
      required: [revoked]
      properties:
        revoked: { type: boolean, enum: [true] }
    # ------------------------------ api keys -----------------------------
    ApiKeyListItem:
      type: object
      required: [id, name, keyPrefix, status, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        keyPrefix: { type: string }
        status: { type: string, enum: [ACTIVE, REVOKED, EXPIRED] }
        scopes: { type: array, items: { type: string } }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKeyListItem"
        - type: object
          required: [apiKey]
          properties:
            apiKey:
              type: string
              description: RAW key — the only time it is ever returned
    ApiKeyCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        scopes:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 64 }
          default: []
          description: 'Empty (default) ⇒ guard grants wildcard `*` — finding H-2'
        expiresInDays: { type: integer, minimum: 1, maximum: 3650 }
    ApiKeyListData:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ApiKeyListItem" } }
        nextCursor: { type: string, nullable: true }
    # ------------------------------ audit --------------------------------
    AuditLogItem:
      type: object
      required: [id, actorType, action, entityType, createdAt]
      properties:
        id: { type: string }
        actorType: { type: string, enum: [USER, API_KEY, SYSTEM, WORKER] }
        actorId: { type: string, nullable: true }
        actorLabel: { type: string, nullable: true, description: Email or key name }
        action: { type: string, description: "e.g. lead.replayed, delivery.replayed, user.updated, auth.login.failed" }
        entityType: { type: string }
        entityId: { type: string, nullable: true }
        ip: { type: string, nullable: true }
        correlationId: { type: string, nullable: true }
        before: { description: Sanitized before-state (secrets stripped) }
        after: { description: Sanitized after-state (secrets stripped) }
        metadata: { description: Sanitized metadata (secret keys removed) }
        createdAt: { type: string, format: date-time }
    AuditLogListData:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditLogItem" } }
        nextCursor: { type: string, nullable: true }
    # ------------------------------ leads --------------------------------
    LeadCanonicalData:
      type: object
      properties:
        name:
          type: object
          properties:
            first: { type: string }
            last: { type: string }
            full: { type: string }
        email: { type: string }
        phone: { type: string }
        location:
          type: object
          properties:
            city: { type: string }
            state: { type: string }
            country: { type: string }
        budget: { type: number }
        currency: { type: string }
        project: { type: string }
        custom: { type: object, additionalProperties: true }
    LeadListItem:
      type: object
      required: [id, status, stage, source, canonicalData, receivedAt, createdAt, updatedAt]
      properties:
        id: { type: string }
        externalLeadId: { type: string, nullable: true }
        status: { type: string, enum: [RECEIVED, PROCESSING, PROCESSED, REJECTED, FAILED] }
        stage:
          type: string
          enum: [RECEIVED, VALIDATION, NORMALIZATION, DEDUPLICATION, ENRICHMENT, SCORING, ROUTING, MAPPING, QUEUED, DELIVERY, COMPLETED, FAILED]
        score: { type: integer, nullable: true }
        scoreVersion: { type: string, nullable: true }
        source:
          type: object
          required: [id, type, name]
          properties:
            id: { type: string }
            type: { type: string }
            name: { type: string }
        canonicalData: { $ref: "#/components/schemas/LeadCanonicalData" }
        receivedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        correlationId: { type: string, nullable: true }
    LeadListData:
      type: object
      required: [items, nextCursor, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/LeadListItem" } }
        nextCursor: { type: string, nullable: true }
        total: { type: integer }
    LeadCreateRequest:
      type: object
      required: [sourceId, sourceAccountId, data]
      properties:
        sourceId: { type: string, maxLength: 64 }
        sourceAccountId: { type: string, maxLength: 64 }
        externalLeadId:
          type: string
          minLength: 1
          maxLength: 200
          description: Optional but strongly recommended — enables 409 dedup on retries (finding H-5)
        data: { type: object, additionalProperties: true }
    LeadProcessing:
      type: object
      description: 1:1 processing record (validation/normalization/dedup/enrichment/routing results)
      properties:
        validationStatus: { type: string, enum: [PENDING, PASSED, FAILED] }
        deduplicationStatus: { type: string, enum: [PENDING, UNIQUE, DUPLICATE, DISABLED] }
        validationResult: {}
        normalizationResult: {}
        deduplicationResult: {}
        enrichmentResult: {}
        routingResult: {}
        correlationId: { type: string, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }
    LeadScore:
      type: object
      required: [id, score, version, computedAt]
      properties:
        id: { type: string }
        score: { type: integer }
        version: { type: string, description: Scoring rule-set version }
        breakdown: { description: Rule-by-rule breakdown (JSON) }
        computedAt: { type: string, format: date-time }
    LeadDuplicateLink:
      type: object
      properties:
        originalLeadId: { type: string }
        strategy: { type: string, enum: [EXTERNAL_ID, PHONE, EMAIL, PHONE_EMAIL, CUSTOM] }
        confidence: { type: number, nullable: true }
    StageEvent:
      type: object
      required: [id, stage, status]
      properties:
        id: { type: string }
        stage: { type: string }
        status: { type: string, enum: [PENDING, RUNNING, PASSED, FAILED, SKIPPED] }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer, nullable: true }
        detail: {}
        error: { type: string, nullable: true }
    RoutingResult:
      type: object
      required: [id, matched, evaluatedAt]
      properties:
        id: { type: string }
        ruleId: { type: string, nullable: true }
        ruleName: { type: string, nullable: true }
        destinationIds: { type: array, items: { type: string } }
        matched: { type: boolean }
        reason: { type: string, nullable: true }
        evaluatedAt: { type: string, format: date-time }
    TimelineData:
      type: object
      required: [stageEvents, scores, routingResults]
      properties:
        stageEvents: { type: array, items: { $ref: "#/components/schemas/StageEvent" } }
        scores: { type: array, items: { $ref: "#/components/schemas/LeadScore" } }
        routingResults: { type: array, items: { $ref: "#/components/schemas/RoutingResult" } }
    RawPayload:
      type: object
      required: [id, payload, receivedAt]
      properties:
        id: { type: string }
        payload: { description: Original inbound payload as stored }
        headers: { type: object, additionalProperties: true, nullable: true }
        checksum: { type: string, nullable: true }
        receivedAt: { type: string, format: date-time }
    LeadPayloadsData:
      type: object
      required: [canonical, payloads]
      properties:
        canonical: { $ref: "#/components/schemas/LeadCanonicalData" }
        normalized: { description: Normalized snapshot (JSON) }
        payloads: { type: array, items: { $ref: "#/components/schemas/RawPayload" } }
    DeliveryAttempt:
      type: object
      required: [id, attemptNumber, status]
      properties:
        id: { type: string }
        attemptNumber: { type: integer, description: 'Global, append-only numbering across replay cycles' }
        status: { type: string, enum: [SUCCEEDED, FAILED, TIMEOUT, RATE_LIMITED, NOT_CONFIGURED, REJECTED] }
        responseStatus: { type: integer, nullable: true }
        responseBody: { type: string, nullable: true, description: 'Truncated (≤2 KB), sanitized' }
        errorCode: { type: string, nullable: true }
        errorCategory: { type: string, nullable: true }
        durationMs: { type: integer, nullable: true }
        externalId: { type: string, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        replayCycle: { type: integer, description: 0 = original run; +1 per replay (phase 2) }
        replayCycleAttempt: { type: integer, description: 1-based attempt index within its cycle }
    LeadDelivery:
      type: object
      required: [id, status, attemptCount, maxAttempts, createdAt, updatedAt, destination]
      properties:
        id: { type: string }
        status: { type: string, enum: [PENDING, QUEUED, IN_PROGRESS, SUCCEEDED, FAILED, DEAD, SKIPPED] }
        attemptCount: { type: integer }
        maxAttempts: { type: integer }
        externalId: { type: string, nullable: true }
        errorCode: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        mappedPayload: { description: Last mapped request body (JSON) }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        destination:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            type: { type: string }
        attempts:
          type: array
          description: 'Most recent 3 attempts only (detail include `take: 3`)'
          items: { $ref: "#/components/schemas/DeliveryAttempt" }
    LeadDetail:
      allOf:
        - $ref: "#/components/schemas/LeadListItem"
        - type: object
          properties:
            sourceAccount:
              type: object
              nullable: true
              properties:
                id: { type: string }
                name: { type: string }
                publicId: { type: string }
            normalizedData: { description: Normalized snapshot (JSON) }
            processing: { $ref: "#/components/schemas/LeadProcessing" }
            scores: { type: array, items: { $ref: "#/components/schemas/LeadScore" } }
            duplicateOf:
              oneOf:
                - $ref: "#/components/schemas/LeadDuplicateLink"
                - type: "null"
            deliveries: { type: array, items: { $ref: "#/components/schemas/LeadDelivery" } }
    ReplayedAck:
      type: object
      required: [replayed]
      properties:
        replayed: { type: boolean, enum: [true] }
    # ------------------------------ sources ------------------------------
    SourceItem:
      type: object
      required: [id, type, code, name, createdAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        type: { type: string, enum: [GOOGLE_ADS, META_ADS, WEBSITE, LINKEDIN, API, WEBHOOK, CSV, CUSTOM] }
        code: { type: string, description: Tenant-unique lowercase-kebab }
        name: { type: string }
        config: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        _count:
          type: object
          properties:
            accounts: { type: integer }
            leads: { type: integer }
    SourceDetail:
      allOf:
        - $ref: "#/components/schemas/SourceItem"
        - type: object
          properties:
            accounts:
              type: array
              items: { $ref: "#/components/schemas/SourceAccount" }
    SourceCreateRequest:
      type: object
      required: [type, code, name]
      properties:
        type: { type: string, enum: [GOOGLE_ADS, META_ADS, WEBSITE, LINKEDIN, API, WEBHOOK, CSV, CUSTOM] }
        code: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", minLength: 2, maxLength: 48 }
        name: { type: string, minLength: 1, maxLength: 120 }
        config: { type: object, additionalProperties: true, default: {} }
    SourceUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        config: { type: object, additionalProperties: true }
    SourceAccount:
      type: object
      required: [id, name, publicId, webhookUrl, createdAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        sourceId: { type: string }
        name: { type: string }
        publicId: { type: string, description: Unguessable id used in the inbound URL }
        config: { type: object, additionalProperties: true }
        webhookUrl: { type: string, format: uri, description: Server-computed POST target }
        createdAt: { type: string, format: date-time }
        signingSecret:
          type: string
          description: Present exactly once — on create (webhook-bearing types) or rotation
    AccountCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        config: { type: object, additionalProperties: true, default: {} }
    AccountUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        config: { type: object, additionalProperties: true }
    SigningSecretAck:
      type: object
      required: [signingSecret]
      properties:
        signingSecret: { type: string, description: New HMAC secret — shown only now }
    # ------------------------------ webhooks -----------------------------
    WebhookAck:
      type: object
      required: [received, duplicate, eventId]
      properties:
        received: { type: boolean, enum: [true] }
        duplicate: { type: boolean, description: 'true → already known, original lead resumed' }
        eventId: { type: string }
        leadId: { type: string, nullable: true }
    WebhookEventListItem:
      type: object
      required: [id, sourceAccountId, status, receivedAt]
      properties:
        id: { type: string }
        sourceAccountId: { type: string }
        externalEventId: { type: string, nullable: true }
        status: { type: string, enum: [RECEIVED, PROCESSED, FAILED, DUPLICATE] }
        leadId: { type: string, nullable: true }
        error: { type: string, nullable: true }
        receivedAt: { type: string, format: date-time }
        processedAt: { type: string, format: date-time, nullable: true }
    WebhookEventListData:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WebhookEventListItem" } }
        nextCursor: { type: string, nullable: true }
    WebhookEventDetail:
      allOf:
        - $ref: "#/components/schemas/WebhookEventListItem"
        - type: object
          properties:
            payload: { description: Sanitized (secret-stripped) stored payload }
            headers: { type: object, additionalProperties: true, description: Sanitized headers }
    # ---------------------------- destinations ---------------------------
    DestinationTypeInfo:
      type: object
      required: [type, requiredConfigKeys]
      properties:
        type: { type: string, enum: [SALESFORCE, ZOHO, DCT_CRM, HUBSPOT, PIPEDRIVE, CUSTOM_API, WEBHOOK] }
        requiredConfigKeys: { type: array, items: { type: string } }
    DestinationItem:
      type: object
      required: [id, type, name, status, createdAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        type: { type: string, enum: [SALESFORCE, ZOHO, DCT_CRM, HUBSPOT, PIPEDRIVE, CUSTOM_API, WEBHOOK] }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        config: { type: object, additionalProperties: true }
        rateLimitPerSec: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        health: { $ref: "#/components/schemas/DestinationHealth" }
        _count:
          type: object
          properties:
            deliveries: { type: integer }
            fieldMappings: { type: integer }
    DestinationCreateRequest:
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [SALESFORCE, ZOHO, DCT_CRM, HUBSPOT, PIPEDRIVE, CUSTOM_API, WEBHOOK] }
        name: { type: string, minLength: 1, maxLength: 120 }
        config: { type: object, additionalProperties: true, default: {} }
        rateLimitPerSec: { type: integer, minimum: 1, maximum: 1000 }
    DestinationUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        status: { type: string, enum: [ACTIVE, DISABLED], description: activate/deactivate }
        config: { type: object, additionalProperties: true }
        rateLimitPerSec: { type: integer, minimum: 1, maximum: 1000, nullable: true }
    DestinationHealth:
      type: object
      properties:
        status: { type: string, description: ConnectionStatus (NOT_CONFIGURED/CONNECTED/DISCONNECTED/ERROR) }
        lastSuccessAt: { type: string, format: date-time, nullable: true }
        lastFailureAt: { type: string, format: date-time, nullable: true }
        lastError: { type: string, nullable: true }
        lastLatencyMs: { type: integer, nullable: true }
        checkedAt: { type: string, format: date-time, nullable: true }
    CredentialSetRequest:
      type: object
      required: [type, secret]
      properties:
        type: { type: string, enum: [WEBHOOK_HMAC, API_KEY, BASIC, OAUTH, BEARER] }
        secret: { type: string, minLength: 1, maxLength: 8192, description: Write-only; AES-256-GCM at rest }
        meta: { type: object, additionalProperties: true, default: {} }
    StoredAck:
      type: object
      required: [stored, type]
      properties:
        stored: { type: boolean, enum: [true] }
        type: { type: string }
    RemovedAck:
      type: object
      required: [removed]
      properties:
        removed: { type: boolean, enum: [true] }
    DestinationTestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        status: { description: 'HTTP status of the probe, number or adapter string' }
        latencyMs: { type: integer, nullable: true }
        error: { type: string, nullable: true }
        detail: { type: string, nullable: true }
    # -------------------------- field mappings ---------------------------
    FieldMappingField:
      type: object
      required: [source, target]
      properties:
        source: { type: string, minLength: 1, maxLength: 200 }
        target: { type: string, minLength: 1, maxLength: 200 }
        required: { type: boolean }
        defaultValue: { description: string | number | boolean }
        transforms:
          type: array
          maxItems: 10
          description: >
            Transform chain: uppercase, lowercase, trim, template, coerce_number,
            coerce_string, coerce_boolean, slice, replace, default_if_empty,
            prefix, suffix, phone_e164
          items: { type: object, additionalProperties: true }
    FieldMappingVersion:
      type: object
      required: [id, version, fields, createdAt]
      properties:
        id: { type: string }
        version: { type: integer }
        fields: { type: array, items: { $ref: "#/components/schemas/FieldMappingField" } }
        notes: { type: string, nullable: true }
        createdBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    FieldMappingListItem:
      type: object
      required: [id, name, destinationId, status, versionCount, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        destinationId: { type: string }
        status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
        activeVersionId: { type: string, nullable: true }
        versionCount: { type: integer }
        destination:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            type: { type: string }
        updatedAt: { type: string, format: date-time }
    FieldMappingListData:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FieldMappingListItem" } }
        nextCursor: { type: string, nullable: true }
    FieldMappingDetail:
      allOf:
        - $ref: "#/components/schemas/FieldMappingListItem"
        - type: object
          properties:
            versions: { type: array, items: { $ref: "#/components/schemas/FieldMappingVersion" } }
    FieldMappingCreateRequest:
      type: object
      required: [destinationId, name, fields]
      properties:
        destinationId: { type: string, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 120 }
        fields:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/FieldMappingField" }
        notes: { type: string, maxLength: 2000 }
        activate: { type: boolean, default: false }
    FieldMappingVersionRequest:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/FieldMappingField" }
        notes: { type: string, maxLength: 2000 }
        activate: { type: boolean, default: false }
    FieldMappingActivateRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
    # ---------------------------- routing rules --------------------------
    RuleCondition:
      type: object
      required: [field, operator]
      properties:
        field: { type: string, minLength: 1, maxLength: 120, description: 'Dotted path, e.g. "canonical.city", "score", "source.type"' }
        operator:
          type: string
          enum: [EQ, NEQ, CONTAINS, NOT_CONTAINS, STARTS_WITH, ENDS_WITH, GT, GTE, LT, LTE, IN, NOT_IN, EXISTS, NOT_EXISTS]
        value: { description: string (≤500) | number | boolean | array of string|number (≤50) }
    RoutingRule:
      type: object
      required: [id, name, enabled, priority, stopOnMatch, conditions, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        enabled: { type: boolean }
        priority: { type: integer, description: Lower evaluates first }
        stopOnMatch: { type: boolean }
        conditions: { type: array, items: { $ref: "#/components/schemas/RuleCondition" } }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
        destinations:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              type: { type: string }
              order: { type: integer }
    RoutingRuleUpsertRequest:
      type: object
      required: [name, conditions, destinationIds]
      description: Full body on create; any subset on PATCH (merge-patch).
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        enabled: { type: boolean, default: true }
        priority: { type: integer, minimum: 1, maximum: 10000, default: 100 }
        stopOnMatch: { type: boolean, default: true }
        conditions:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/RuleCondition" }
        destinationIds:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, maxLength: 64 }
    # ----------------------------- automation ----------------------------
    ScoringRule:
      type: object
      required: [id, label, condition, points]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        label: { type: string, minLength: 1, maxLength: 200 }
        condition: { $ref: "#/components/schemas/RuleCondition" }
        points: { type: integer, minimum: -1000, maximum: 1000 }
    ScoringRuleSet:
      type: object
      required: [id, name, version, enabled, rules, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string, description: Immutable label like "v1" }
        enabled: { type: boolean, description: Exactly one set enabled per tenant }
        rules: { type: array, items: { $ref: "#/components/schemas/ScoringRule" } }
        activatedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    ScoringRuleSetUpsertRequest:
      type: object
      required: [name, rules]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        enabled: { type: boolean, default: false }
        rules:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ScoringRule" }
    EnabledPatch:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    DedupConfig:
      type: object
      required: [enabled, strategy, matchFields]
      properties:
        id: { type: string }
        enabled: { type: boolean }
        strategy: { type: string, enum: [EXTERNAL_ID, PHONE, EMAIL, PHONE_EMAIL, CUSTOM] }
        matchFields: { type: array, items: { type: string }, maxItems: 10 }
        updatedAt: { type: string, format: date-time }
    DedupConfigRequest:
      type: object
      required: [enabled, strategy]
      properties:
        enabled: { type: boolean }
        strategy: { type: string, enum: [EXTERNAL_ID, PHONE, EMAIL, PHONE_EMAIL, CUSTOM] }
        matchFields: { type: array, items: { type: string }, maxItems: 10, default: [] }
    EnrichmentStatus:
      type: object
      required: [implemented, providers]
      properties:
        implemented: { type: boolean, enum: [false] }
        providers: { type: array, items: { type: string }, description: Always empty today }
        note: { type: string, description: Honest explanation that the stage records SKIPPED }
    # ----------------------------- deliveries ----------------------------
    QueueStats:
      type: object
      required: [queues, deadLetters]
      properties:
        queues:
          type: object
          description: Queue name → BullMQ counts (waiting/active/completed/failed/delayed…) or {error}
          additionalProperties:
            type: object
            additionalProperties: true
            description: 'BullMQ counts (waiting/active/completed/failed/delayed…) or an {error} object'
        deadLetters:
          type: object
          description: '<queue>-dlq → counts or {error}'
          additionalProperties: { type: object, additionalProperties: true }
    QueueJob:
      type: object
      required: [id, data]
      description: >
        Raw BullMQ job view — **GLOBAL across all tenants** (finding H-1).
        One-shot failure shape: a single object containing only {error}.
      properties:
        id: { type: string }
        name: { type: string, description: Job name }
        queue: { type: string, description: Queue name (DLQ views append -dlq) }
        data: { type: object, additionalProperties: true, description: Includes tenantId/leadId/payload — the H-1 leak }
        failedReason: { type: string, nullable: true }
        attemptsMade: { type: integer }
        createdAt: { type: string, format: date-time, nullable: true, description: Dead-letter view (job.timestamp) }
        processedOn: { type: string, format: date-time, nullable: true }
        retryAt: { type: string, format: date-time, nullable: true, description: 'Failed view — currently job creation time, not next retry (frontend mismatch I-3)' }
        error: { type: string, description: Present instead of job rows when Redis is unavailable }
    DeliveryListItem:
      type: object
      required: [id, leadId, destination, status, attemptCount, maxAttempts, createdAt, updatedAt]
      properties:
        id: { type: string }
        leadId: { type: string }
        lead:
          type: object
          nullable: true
          properties:
            id: { type: string }
            receivedAt: { type: string, format: date-time, nullable: true }
        destination:
          type: object
          required: [id, name, type]
          properties:
            id: { type: string }
            name: { type: string }
            type: { type: string }
        status: { type: string, enum: [PENDING, QUEUED, IN_PROGRESS, SUCCEEDED, FAILED, DEAD, SKIPPED] }
        attemptCount: { type: integer }
        maxAttempts: { type: integer }
        replayCount: { type: integer, description: Times this delivery has been replayed (phase 2) }
        cycleStartAttempt: { type: integer, description: Global attempt number where the current cycle began }
        externalId: { type: string, nullable: true }
        errorCode: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        correlationId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        _count:
          type: object
          properties:
            attempts: { type: integer }
    DeliveryListData:
      type: object
      required: [items, nextCursor, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DeliveryListItem" } }
        nextCursor: { type: string, nullable: true }
        total: { type: integer }
    DeliveryDetail:
      allOf:
        - $ref: "#/components/schemas/DeliveryListItem"
        - type: object
          properties:
            attempts:
              type: array
              description: Full attempt history, newest first (immutable)
              items: { $ref: "#/components/schemas/DeliveryAttempt" }
    QueuedAck:
      type: object
      required: [queued]
      properties:
        queued: { type: boolean, enum: [true] }
    # ------------------------------ imports ------------------------------
    ImportJob:
      type: object
      required: [id, fileName, fileSizeBytes, status, createdAt]
      description: Safe list/detail select for job rows.
      properties:
        id: { type: string }
        fileName: { type: string }
        fileSizeBytes: { type: integer }
        status: { type: string, enum: [PENDING, PARSING, PROCESSING, COMPLETED, FAILED, CANCELLED] }
        totalRows: { type: integer, nullable: true }
        processedRows: { type: integer }
        successfulRows: { type: integer }
        failedRows: { type: integer }
        duplicateRows: { type: integer }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }
    ImportListData:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ImportJob" } }
        nextCursor: { type: string, nullable: true }
    ImportJobDetail:
      allOf:
        - $ref: "#/components/schemas/ImportJob"
        - type: object
          properties:
            storageKey:
              type: string
              description: Internal object-storage key — leaked by detail but excluded from list (finding H-9)
            checksum: { type: string, description: SHA-256 of the uploaded file (finding H-9) }
            sourceId: { type: string, nullable: true }
    # ----------------------------- analytics -----------------------------
    AnalyticsOverview:
      type: object
      required: [leads, deliveries, inbound, generatedAt]
      properties:
        leads:
          type: object
          properties:
            total24h: { type: integer }
            total7d: { type: integer }
            total30d: { type: integer }
            byStatus: { type: object, additionalProperties: { type: integer } }
        deliveries:
          type: object
          properties:
            total: { type: integer }
            succeeded: { type: integer }
            failedOrDead: { type: integer }
            successRate: { type: number, nullable: true }
            avgAttemptsOnSuccess: { type: number, nullable: true }
            byStatus: { type: object, additionalProperties: { type: integer } }
        inbound:
          type: object
          properties:
            webhookEvents24h: { type: integer }
        topSources: { type: array, items: { type: object, additionalProperties: true } }
        topDestinations: { type: array, items: { type: object, additionalProperties: true } }
        generatedAt: { type: string, format: date-time }
    TimeseriesData:
      type: object
      required: [days, leads, deliveries]
      properties:
        days: { type: integer }
        leads:
          type: array
          items:
            type: object
            properties:
              date: { type: string }
              count: { type: integer }
        deliveries:
          type: array
          items:
            type: object
            properties:
              date: { type: string }
              count: { type: integer }
    SourcePerformanceRow:
      type: object
      required: [source, total, byStatus]
      properties:
        source:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            code: { type: string }
            type: { type: string }
        total: { type: integer }
        byStatus: { type: object, additionalProperties: { type: integer } }
    DestinationPerformanceRow:
      type: object
      required: [destination, total, succeeded, byStatus]
      properties:
        destination:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            type: { type: string }
            status: { type: string }
        total: { type: integer }
        succeeded: { type: integer }
        byStatus: { type: object, additionalProperties: { type: integer } }
        successRate: { type: number, nullable: true }
        avgLatencyMs: { type: number, nullable: true }
    PipelineFunnel:
      type: object
      required: [total, stages]
      properties:
        total: { type: integer }
        stages:
          type: array
          items:
            type: object
            required: [stage, count, share]
            properties:
              stage: { type: string }
              count: { type: integer }
              share: { type: number }
    # ------------------------------- health ------------------------------
    HealthReport:
      type: object
      required: [status, checks, version, uptimeSec]
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          properties:
            database:
              type: object
              properties:
                ok: { type: boolean }
                latencyMs: { type: integer }
                error: { type: string, description: Raw driver error (finding H-10) }
            redis:
              type: object
              properties:
                ok: { type: boolean }
                latencyMs: { type: integer }
                error: { type: string }
        version: { type: string }
        uptimeSec: { type: integer }

