  /webhooks/inbound/{publicId}:
    post:
      tags: [webhooks]
      operationId: webhookIngress
      summary: Public signed lead ingress (raw body HMAC-SHA256)
      description: |
        Unauthenticated by token: identified by unguessable `publicId` → account →
        tenant/source. Signature header: `x-signature` / `x-hub-signature-256` /
        `x-middleware-signature` (hex HMAC-SHA256 over the **raw body**, timing-safe
        compare). Verification runs when the account has a secret; unsigned traffic
        is accepted if no secret exists unless `requireSignature` is set (finding H-6).
        Idempotency: `@@unique(tenant, account, externalEventId)` — duplicates ack
        with `duplicate: true` and resume the original lead. Fast-ack 201; enqueue
        failure → 503.
      x-audit-status: implemented
      x-permission: public
      x-rate-limit: "600/min"
      security: []
      parameters:
        - name: publicId
          in: path
          required: true
          schema: { type: string, minLength: 8, maxLength: 64 }
      requestBody:
        required: true
        description: Arbitrary provider payload (object or array) — kept as raw bytes for HMAC.
        content:
          application/json:
            schema:
              description: Provider-specific JSON; shape is intentionally `unknown`.
      responses:
        "201":
          description: Accepted and enqueued (or acknowledged as duplicate)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/WebhookAck" }
        "401":
          description: Signature verification failed (`WEBHOOK_SIGNATURE_INVALID`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown publicId (`WEBHOOK_UNKNOWN_SOURCE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422":
          description: Unprocessable payload (`WEBHOOK_PAYLOAD_INVALID`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
