openapi: 3.1.0
info:
  title: Lead Integration & Distribution Middleware API
  version: "1.0.0"
  description: |
    Multi-tenant lead intake, processing, routing and delivery API (NestJS).

    ## Envelope
    Every JSON response is wrapped:
    ```json
    { "success": true,  "data": { } }
    { "success": false, "error": { "code": "VALIDATION_FAILED", "message": "...", "requestId": "req_...", "details": {} } }
    ```
    The CSV error download (`GET /imports/{id}/errors`) is the only endpoint that
    bypasses the envelope (`@SkipTransform`, `Content-Type: text/csv`).

    ## Status codes
    Nest defaults are used (there is no `@HttpCode` anywhere): **every POST returns
    201**, all other methods return 200. Failures never return 200 — except
    `GET /health`, which always returns 200 (known deviation, see `x-known-issues`).

    ## Authentication
    - `Authorization: Bearer <JWT>` (access token, default TTL 900 s)
    - `x-api-key: <raw API key>` (takes precedence when present)
    - Public routes: auth register/login/refresh/logout, webhook ingress, health.
    - Permissions are re-resolved from the tenant role **on every request**.

    ## Pagination
    Cursor-based on list endpoints: `cursor` (opaque, ≤512 chars) + `limit`
    (1–100, default 25). Response: `{ items, nextCursor }` (+ `total` on leads and
    deliveries). Bare-array responses (no pagination) exist for reference data:
    sources, source accounts, destinations, destination types, roles, routing
    rules, scoring sets, analytics rows — all tenant-scoped but unbounded (audit
    finding H-8).

    ## Rate limits
    300 req/min/IP global; 20/min on register/login/refresh; 600/min on webhook
    ingress. 429 → `RATE_LIMITED`.

    ## Idempotency
    `Idempotency-Key` is **not** read anywhere. Real idempotency comes from DB
    uniques: webhook events `(tenant, account, externalEventId)`, leads
    `(tenant, sourceAccount, externalLeadId)` (optional field — finding H-5),
    deliveries `(tenant, lead, destination)`, attempts `(tenant, delivery,
    attemptNumber)`. Outbound delivery requests carry `Idempotency-Key`.

    ## x-audit-status
    This spec documents **only endpoints that exist in code** (81 operations, all
    `x-audit-status: implemented`, except `GET /automation/enrichment` and
    `GET /health` which are `partial`). Planned/missing endpoints are listed in
    `docs/api-gaps.md` and are intentionally absent here.

    ## x-known-issues (from docs/api-security-audit.md)
    - H-1: `GET /deliveries/dead-letter` and `GET /deliveries/failed` return job
      data of **all tenants** (global BullMQ view) — cross-tenant read.
    - H-2: `POST /api-keys` with default `scopes: []` yields a wildcard `*`
      (all-permissions) key.
    - H-6: webhook ingress returns **201** although internal docs specify 202.
    - H-10: `GET /health` returns 200 even when degraded and does not check the worker.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development API (all paths below are relative to /api/v1)
tags:
  - name: auth
    description: Registration, login, token refresh, session bootstrap
  - name: tenants
    description: Workspace (current tenant) read/rename
  - name: users
    description: Tenant user management
  - name: roles
    description: Roles and the permission catalog
  - name: api-keys
    description: Programmatic API keys (x-api-key auth)
  - name: audit-logs
    description: Immutable audit trail
  - name: leads
    description: Lead CRUD, timeline, raw payloads, pipeline replay
  - name: sources
    description: Lead sources, inbound accounts, webhook URLs, secret rotation
  - name: webhooks
    description: Signed public ingress and event history
  - name: destinations
    description: Delivery targets, credentials, health, connection tests
  - name: field-mappings
    description: Versioned destination field mappings
  - name: routing-rules
    description: Priority-based routing rules
  - name: automation
    description: Scoring rule sets, deduplication config, enrichment status
  - name: deliveries
    description: Delivery records, attempts, replay, queue views
  - name: imports
    description: Asynchronous CSV import jobs
  - name: analytics
    description: Server-side aggregated metrics
  - name: health
    description: Liveness/readiness probe
security:
  - bearerAuth: []
  - apiKeyAuth: []
paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: authRegister
      summary: Create a new tenant (workspace) with an admin user
      description: |
        Creates tenant + admin user + system roles in one transaction. The refresh
        token is also set as an httpOnly cookie scoped to `/api/v1/auth`.
      x-audit-status: implemented
      x-permission: public
      x-rate-limit: "20/min"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Tenant created; tokens issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/login:
    post:
      tags: [auth]
      operationId: authLogin
      summary: Exchange credentials for access + refresh tokens
      description: Generic 401 for bad credentials (no user enumeration). Failures are audited.
      x-audit-status: implemented
      x-permission: public
      x-rate-limit: "20/min"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "201":
          description: Tokens issued; refresh token also set as httpOnly cookie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: authRefresh
      summary: Rotate the refresh token and issue a new access token
      description: |
        Refresh token from the httpOnly cookie or the request body. Rotation is
        mandatory: reuse of an already-rotated token revokes ALL sessions of the
        user (audited as `auth.refresh.reuse`). Origin header is checked when present.
      x-audit-status: implemented
      x-permission: public
      x-rate-limit: "20/min"
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "201":
          description: New token pair; refresh cookie replaced
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: Revoke the current session and clear the refresh cookie
      description: |
        Accepts the refresh cookie or `{refreshToken}` in the body; possession of
        the refresh token is sufficient (no bearer required). Already-issued access
        tokens remain valid until expiry (finding H-3, ≤ JWT_ACCESS_TTL).
        Known gap (H-7): logout is not audit-logged.
      x-audit-status: implemented
      x-permission: public
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "201":
          description: Session revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RevokedAck" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/me:
    get:
      tags: [auth]
      operationId: authMe
      summary: Current user, tenant and effective permissions (web bootstrap)
      x-audit-status: implemented
      x-permission: authenticated (self-scoped)
      responses:
        "200":
          description: Session principal
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MeResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /tenants/me:
    get:
      tags: [tenants]
      operationId: tenantsGetMe
      summary: Current workspace (id, name, slug, status)
      x-audit-status: implemented
      x-permission: authenticated (self-scoped)
      responses:
        "200":
          description: Workspace summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TenantSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    patch:
      tags: [tenants]
      operationId: tenantsUpdateMe
      summary: Rename the current workspace (slug is immutable)
      x-audit-status: implemented
      x-permission: tenant:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantUpdateRequest" }
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TenantSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /users:
    get:
      tags: [users]
      operationId: usersList
      summary: List tenant users (cursor paginated)
      x-audit-status: implemented
      x-permission: users:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of users with role summaries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserListData" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [users]
      operationId: usersCreate
      summary: Create a user with a role
      description: Password is bcrypt-hashed (cost 12) and never returned.
      x-audit-status: implemented
      x-permission: users:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreateRequest" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserListItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /users/{id}:
    patch:
      tags: [users]
      operationId: usersUpdate
      summary: Update a user (name, role, status — activate/deactivate)
      description: Self-disabling is refused (403). Cross-tenant id → 404.
      x-audit-status: implemented
      x-permission: users:write
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdateRequest" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserListItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /roles:
    get:
      tags: [roles]
      operationId: rolesList
      summary: List roles with permission arrays and user counts
      description: Returns a **bare array** (tenant-scoped, unbounded — finding H-8).
      x-audit-status: implemented
      x-permission: roles:read
      responses:
        "200":
          description: All tenant roles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/RoleListItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [roles]
      operationId: rolesCreate
      summary: Create a custom role
      description: Permissions must be valid catalog codes (34 available); wildcard not allowed.
      x-audit-status: implemented
      x-permission: roles:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleUpsertRequest" }
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RoleListItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /roles/permissions:
    get:
      tags: [roles]
      operationId: rolesPermissionCatalog
      summary: Permission catalog + role templates
      description: Serves the product requirement "GET /permissions" (canonical path is /roles/permissions).
      x-audit-status: implemented
      x-permission: roles:read
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PermissionCatalog" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /roles/{id}:
    patch:
      tags: [roles]
      operationId: rolesUpdate
      summary: Update a role (system roles are immutable)
      x-audit-status: implemented
      x-permission: roles:write
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleUpsertRequest" }
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RoleListItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [roles]
      operationId: rolesDelete
      summary: Delete a role (refused while assigned or system)
      x-audit-status: implemented
      x-permission: roles:write
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Role deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DeletedAck" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api-keys:
    get:
      tags: [api-keys]
      operationId: apiKeysList
      summary: List API keys (hash never returned; cursor paginated)
      x-audit-status: implemented
      x-permission: apikeys:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of API keys
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ApiKeyListData" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [api-keys]
      operationId: apiKeysCreate
      summary: Create an API key — raw value returned ONCE
      description: |
        `scopes` defaults to `[]`, which the guard maps to wildcard `*`
        (all permissions) — **finding H-2: default = super-admin key**.
      x-audit-status: implemented
      x-permission: apikeys:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiKeyCreateRequest" }
      responses:
        "201":
          description: Key created; `apiKey` is shown only here
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ApiKeyCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api-keys/{id}:
    delete:
      tags: [api-keys]
      operationId: apiKeysRevoke
      summary: Revoke an API key (idempotent)
      x-audit-status: implemented
      x-permission: apikeys:write
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Revoked (also true when already revoked)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RevokedAck" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /audit-logs:
    get:
      tags: [audit-logs]
      operationId: auditLogsList
      summary: Query the audit trail (tenant-scoped, cursor paginated)
      description: Metadata is secret-stripped (tokens/keys/passwords removed) before storage and response.
      x-audit-status: implemented
      x-permission: audit:read
      parameters:
        - name: action
          in: query
          schema: { type: string, maxLength: 100 }
        - name: entityType
          in: query
          schema: { type: string, maxLength: 100 }
        - name: entityId
          in: query
          schema: { type: string, maxLength: 64 }
        - name: actorId
          in: query
          schema: { type: string, maxLength: 64 }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of audit entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuditLogListData" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /leads:
    get:
      tags: [leads]
      operationId: leadsList
      summary: List/filter leads (cursor paginated, includes total)
      x-audit-status: implemented
      x-permission: leads:read
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [RECEIVED, PROCESSING, PROCESSED, REJECTED, FAILED]
        - name: sourceId
          in: query
          schema: { type: string, maxLength: 64 }
        - name: destinationId
          in: query
          schema: { type: string, maxLength: 64 }
        - name: scoreMin
          in: query
          schema: { type: integer, minimum: 0, maximum: 1000 }
        - name: q
          in: query
          description: Free-text filter (server-side)
          schema: { type: string, maxLength: 200 }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: sort
          in: query
          schema: { type: string, enum: ["receivedAt:asc", "receivedAt:desc"] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of leads
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/LeadListData" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [leads]
      operationId: leadsCreate
      summary: Manually create a lead (enqueues intake)
      description: |
        409 `LEAD_DUPLICATE` on a second insert with the same
        `(tenant, sourceAccountId, externalLeadId)`. Without `externalLeadId`
        retries create duplicates — `Idempotency-Key` is not honored (finding H-5).
      x-audit-status: implemented
      x-permission: leads:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadCreateRequest" }
      responses:
        "201":
          description: Lead accepted (status RECEIVED); intake job enqueued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/LeadListItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /leads/{id}:
    get:
      tags: [leads]
      operationId: leadsGet
      summary: Lead detail (source, account, processing, scores, duplicates, deliveries)
      description: Cross-tenant id → 404. Deliveries embed their **last 3 attempts** each.
      x-audit-status: implemented
      x-permission: leads:read
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Lead detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/LeadDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [leads]
      operationId: leadsDelete
      summary: Hard-delete a lead (audited)
      description: No frontend consumer today (inventory §E).
      x-audit-status: implemented
      x-permission: leads:delete
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
